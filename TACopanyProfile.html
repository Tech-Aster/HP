      const PPT_REAL_WIDTH = 1280;

      const device = (function () {

        const isIOS =

      let selectedSlides = new Set();

      /**
       * Send postMessage to parent window
       * @param {string} type - Message type
       * @param {Object} slideConfig - Slide configuration object
       */
      function sendPostMessage(type, slideConfig) {
        const fileName = slideConfig.file_url.split("/").pop().split("?")[0];
        const message = {
          type: type,
          payload: {
            title: slideConfig.title,
            url: slideConfig.file_url,
            name: fileName,
            file_type: "html",

        const targetOrigin = config.target_origin || "*";
        window.parent.postMessage(message, targetOrigin);

      /**

        const frameContainer = document.querySelector(

        if (!frameContainer || !slide) return;

        if (selectedSlides.has(slideIndex)) {
          // Deselect
          selectedSlides.delete(slideIndex);
          frameContainer.classList.remove("selected");
          sendPostMessage("remove_prototype_from_chat", slide);
        } else {

          frameContainer.classList.add("selected");
          sendPostMessage("add_prototype_to_chat", slide);

      // Update scale for all iframes

          slideWrapper.className = "slide-wrapper";
          slideWrapper.id = `slide-${index + 1}`;

          const frameContainer = document.createElement("div");
          frameContainer.className = "slide-frame-container";

          const iframe = document.createElement("iframe");
          iframe.className = "slide-iframe";
          iframe.title = slide.title;
          iframe.width = PPT_REAL_WIDTH;
          iframe.height = PPT_REAL_HEIGHT;

            // 移动端且超过 12 页：延迟加载，由轮播式虚拟化管理
            iframe.dataset.src = slide.file_url;
          } else {

            iframe.src = slide.file_url;
          }

          placeholder.className = "slide-placeholder";

          const indexEl = document.createElement("div");
          indexEl.className = "slide-placeholder-index";
          indexEl.textContent = index + 1;

          titleEl.className = "slide-placeholder-title";
          titleEl.textContent = slide.title;

            update();
          });
          virtualRo.observe(container);
          _observers.push(virtualRo);
